

<div class="form-field">
    <label for="fieldText" class="form-label">formulario</label>
    <input type="text" class="form-control" id="fieldText" [(ngModel)]="nombreForm">
    <input type="text" class="form-control" id="fieldText" [(ngModel)]="apellidosForm">
    <input type="text" class="form-control" id="fieldText" [(ngModel)]="nifForm">
    <input type="email" class="form-control" id="fieldText" placeholder="name@example.com" [(ngModel)]="emailForm">
    <input type="text" class="form-control" id="fieldText" [(ngModel)]="sexoForm">
    <br>
    <p>contraseña</p>
    <input type="password" class="form-control" id="fieldPassword" [(ngModel)]="contraseniaForm">
    <p>confirma contraseña</p>
    <input type="password" class="form-control" id="fieldPassword" [(ngModel)]="confirmarcontraseniaForm">


</div>

<div class="form-text">
        tu nombre es: {{nombreForm}}
</div>
<div class="form-text">
        tus apellidos son: {{apellidosForm}}
</div>
<div class="form-text">
        tu NIF es: {{nifForm}}
</div>
<div class="form-text">
        tu email es: {{emailForm}}
</div>
<div class="form-text">
        tu sexo es: {{sexoForm}}
</div>
<div class="form-text">
        tu contraseña es: {{confirmarcontraseniaForm}}
</div>
